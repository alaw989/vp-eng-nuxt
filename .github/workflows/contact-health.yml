name: Contact form health

# A failed run alerts through GitHub, so it still works when the mail server the
# form relies on is the thing that broke. The endpoint returns 503 once an enquiry
# has gone unsent for 30 minutes.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check the contact mailer
        run: curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 30 https://whiteboard.vp-associates.com/api/contact/health
