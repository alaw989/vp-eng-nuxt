; WordPress CMS (cms.vp-associates.com). Own user so a compromise of the whiteboard
; pool cannot touch WordPress files, and WordPress can only write uploads/upgrade.
[cms]
user = wp-cms
group = wp-cms
listen = /run/php/php8.4-fpm-cms.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,proc_nice
php_admin_value[open_basedir] = /var/www/cms.vp-associates.com/:/tmp/:/usr/share/php/:/var/lib/php/sessions/:/dev/urandom
php_admin_value[session.save_path] = /var/lib/php/sessions
php_admin_value[upload_tmp_dir] = /tmp
