# cms.vp-associates.com: headless WordPress. The public site reads its REST API
# at build time; editors use the admin behind the WPS Hide Login URL.
# Installed as /etc/nginx/sites-available/cms.vp-associates.com (see deploy/nginx/README.md).
#
# PHP runs only for WordPress's entry points. Everything else ending in .php
# (plugins, themes, uploads, wp-includes) is denied, so a file dropped into
# wp-content can neither execute nor be read.

server {
    listen 443 ssl;
    server_name cms.vp-associates.com;
    root /var/www/cms.vp-associates.com;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/cms.vp-associates.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.vp-associates.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64M;

    # No X-Frame-Options/frame-ancestors: vp-associates.com shows CMS PDFs in an iframe
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Denied outright ------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ { allow all; }
    location ~ /\. { deny all; }
    location = /xmlrpc.php { deny all; }
    location ~* ^/(readme\.html|license\.txt|wp-config[^/]*\.php)$ { deny all; }
    location ~* ^/wp-content/(updraft|wflogs|upgrade|upgrade-temp-backup|debug\.log) { deny all; }

    # Block the WordPress front end (the public site is vp-associates.com)
    location = / { return 403; }

    # --- PHP entry points -----------------------------------------------------
    location ~ ^/(index|wp-login|wp-cron)\.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
    }
    location ~ ^/wp-admin/.+\.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
    }
    # The classic editor (Disable Gutenberg) loads TinyMCE through this script
    location = /wp-includes/js/tinymce/wp-tinymce.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    # Any other .php: never executed, never served as source
    location ~* \.php$ { deny all; }

    # --- Everything else ------------------------------------------------------
    location ~* ^/(wp-includes|wp-content)/ {
        try_files $uri =404;
        expires 30d;
    }
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
}

server {
    listen 80;
    server_name cms.vp-associates.com;
    return 301 https://$host$request_uri;
}
