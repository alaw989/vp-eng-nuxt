# Security headers for vp-associates.com.
# nginx drops server-level add_header directives in any location that sets its
# own add_header, so every location in the site config includes this file.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Scripts are not restricted: Nuxt inlines its payload and the CSS loader uses
# inline onload handlers. These directives still block framing, plugins, base
# hijacking and form posts to unexpected hosts (the contact form uses Formspree).
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io; upgrade-insecure-requests" always;
