# vp-associates.com: static site from `nuxt generate`, deployed by
# .github/workflows (rsync of .output/public to /var/www/vp-associates).
# Installed as /etc/nginx/sites-available/vp-associates.com (see deploy/nginx/README.md).

server {
    listen 443 ssl;
    server_name www.vp-associates.com;

    ssl_certificate /etc/letsencrypt/live/vp-associates.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vp-associates.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://vp-associates.com$request_uri;
}

server {
    listen 443 ssl;
    server_name vp-associates.com;
    root /var/www/vp-associates;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/vp-associates.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vp-associates.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Compress on the fly by default. The build's .gz copies of HTML are written
    # before the critical-CSS step rewrites the .html, so they are stale and cause
    # hydration mismatches; only the hashed asset directories use gzip_static.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;

    # Legacy WordPress URLs (routeRules redirects do not run on static hosting)
    rewrite ^/about-3/?$ /about permanent;
    rewrite ^/portfolio(/.*)?$ /projects permanent;
    rewrite ^/gallery(/.*)?$ /projects permanent;

    # Canonical URLs have no trailing slash
    rewrite ^/(.+)/$ /$1 permanent;

    # Unknown URLs get a real 404 (the build's 404.html renders the not-found page)
    error_page 404 /404.html;

    # Pages: always revalidate, so a deploy shows up immediately
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include snippets/vp-security-headers.conf;
    }

    # Content-hashed build output and prerendered image variants never change
    location ^~ /_nuxt/ {
        gzip_static on;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/vp-security-headers.conf;
    }
    location ^~ /_ipx/ {
        gzip_static on;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/vp-security-headers.conf;
    }

    # The service worker and PWA manifest must update promptly
    location ~ ^/(sw\.js|workbox-[\w-]+\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include snippets/vp-security-headers.conf;
    }

    # Payloads change with every build
    location ~ _payload\.json$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include snippets/vp-security-headers.conf;
    }

    # Other static files (/images, icons, fonts) have stable names but may be replaced
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|css|js|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        include snippets/vp-security-headers.conf;
    }
}

server {
    listen 80;
    server_name vp-associates.com www.vp-associates.com;
    return 301 https://vp-associates.com$request_uri;
}
